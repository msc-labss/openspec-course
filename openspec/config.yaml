schema: spec-driven

# What the agent should know before it plans a change (added in episode 6).
context: |
  tasklog has no dependencies and must stay that way.
  A tasks.json written by an older version must still load.
  Every error is "tasklog: <message>" on standard error, exit code 1.

rules:
  design:
    - Number the decisions D1, D2, ... and name the option that was rejected
  tasks:
    - End every task with how to verify it
    - Name the decision a task implements, for example (D2)
